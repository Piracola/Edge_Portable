name: Edge Portable Build

on:
  workflow_dispatch:
    inputs:
      builder_ref:
        description: ChromiumPortable engine release tag.
        required: false
        default: v2
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *"

# 流水线本体在 ChromiumPortable 的 reusable workflow 里：check（Linux，版本发现 + 配置校验）
# → build（Windows，构建 → 校验 → 渲染 → 发布）。这里只声明触发条件与目标列表，
# 加架构或加渠道改一行 targets 即可。
jobs:
  build:
    permissions:
      contents: write
    uses: Piracola/ChromiumPortable/.github/workflows/portable-browser.yml@main
    with:
      builder-repository: Piracola/ChromiumPortable
      builder-ref: ${{ github.event.inputs.builder_ref || 'v2' }}
      config: browser.json
      targets: edge_stable,edge_arm64
      artifact-name: Edge-Portable-Builds
      artifact-retention-days: 15
